<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé Signature ErgoVision : Cyan Médical vers Émeraude Kiné -->
    <linearGradient id="ergoBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0060ab"/>
      <stop offset="45%" stop-color="#0f6cbd"/>
      <stop offset="85%" stop-color="#107c41"/>
      <stop offset="100%" stop-color="#2d9d5f"/>
    </linearGradient>

    <!-- Dégradé Halo & Lueur interne -->
    <linearGradient id="ergoGlowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ombre douce portée -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f6cbd" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.4"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Fond Squircle Moderne Fluent / Apple HIG -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#ergoBrandGrad)" filter="url(#softShadow)"/>

  <!-- Reflet Spéculaire Supérieur (Verre / Acrylique Mica) -->
  <rect x="32" y="32" width="448" height="224" rx="112" fill="url(#ergoGlowGrad)" clip-path="url(#topClip)"/>

  <!-- Anneau Extérieur de Vision / Iris Optique Bienveillant -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.25" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Axe d'Alignement Postural (Ligne Laser Zéro) -->
  <line x1="256" y1="96" x2="256" y2="416" stroke="#ffffff" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="8 6"/>

  <!-- Segments Vertébraux du Rachis (Colonne Biomécanique Alignée) -->
  <!-- Tête / Atlas C1-C2 (Foyer Supérieur) -->
  <circle cx="256" cy="144" r="24" fill="#ffffff" filter="url(#innerGlow)"/>
  <circle cx="256" cy="144" r="10" fill="#0f6cbd"/>

  <!-- Vertèbre Cervicale C5-C7 (Courbure équilibrée) -->
  <path d="M 216 198 Q 256 186 296 198 Q 284 216 256 216 Q 228 216 216 198 Z" fill="#ffffff"/>

  <!-- Vertèbre Thoracique Haute T1-T4 (Ceinture scapulaire / Épaules) -->
  <path d="M 194 246 Q 256 230 318 246 Q 302 268 256 268 Q 210 268 194 246 Z" fill="#ffffff"/>
  <!-- Connecteurs Scapulaires latéraux (Stabilité des trapèzes) -->
  <circle cx="168" cy="252" r="8" fill="#ffffff" fill-opacity="0.85"/>
  <line x1="176" y1="252" x2="194" y2="252" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="344" cy="252" r="8" fill="#ffffff" fill-opacity="0.85"/>
  <line x1="336" y1="252" x2="318" y2="252" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Vertèbre Dorsale T6-T10 (Cœur de posture) -->
  <path d="M 204 300 Q 256 286 308 300 Q 296 322 256 322 Q 216 322 204 300 Z" fill="#ffffff"/>

  <!-- Vertèbre Lombaire L1-L5 (Base de sustentation pelvienne) -->
  <path d="M 220 354 Q 256 342 292 354 Q 280 374 256 374 Q 232 374 220 354 Z" fill="#ffffff"/>

  <!-- Repères d'Optique & Calibration (Focus Brackets) -->
  <path d="M 132 180 L 132 144 L 168 144" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-opacity="0.8"/>
  <path d="M 380 180 L 380 144 L 344 144" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-opacity="0.8"/>
  <path d="M 132 332 L 132 368 L 168 368" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-opacity="0.8"/>
  <path d="M 380 332 L 380 368 L 344 368" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" stroke-opacity="0.8"/>
</svg>
